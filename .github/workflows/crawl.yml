# Free 15-minute crawler. Runs the whole pipeline (crawl → alerts → prune) inside GitHub Actions
# against your hosted Postgres, so it needs no paid scheduler and no long-running server.
#
# Setup: GitHub repo → Settings → Secrets and variables → Actions → "New repository secret":
#   DATABASE_URL    Supabase "Session pooler" connection string (required)
#   SITE_URL        https://your-app.vercel.app (used for links in alert emails)
#   SMTP_USER       your Gmail address              ┐ optional: without these, alerts are only logged
#   SMTP_PASS       a Gmail App Password            ┘ (or RESEND_API_KEY + EMAIL_FROM for Resend)
#   HEALTHCHECK_URL https://hc-ping.com/…           optional: emails you if crawls stop
#
# Timing: GitHub's own schedule is unreliable (it often skips runs for hours), so each run queues
# the next one itself, 15 minutes after it started. The schedule below is only a safety net that
# restarts the chain if it ever breaks. The concurrency group keeps it to one chain.
# To pause crawling: Actions → crawl → "…" → Disable workflow.
#
# Cost: free and unlimited on a public repo (the chain keeps one runner busy). Don't use this
# chain on a private repo: it would use ~43,000 minutes/month against a ~2,000 minute allowance.
name: crawl

on:
  schedule:
    # Safety net only (see "Timing" above); offset from :00, when GitHub is busiest.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: {}

concurrency:
  group: crawl
  cancel-in-progress: false

permissions:
  contents: read
  actions: write # lets a run queue the next run

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - run: echo "STARTED=$(date +%s)" >> "$GITHUB_ENV"

      # Until the database secret exists there is nothing to crawl into, so skip cleanly instead of
      # crawling into a throwaway database and showing a misleading green run.
      - name: Check configuration
        if: env.DATABASE_URL == ''
        run: echo "::notice title=Not configured yet::Add the DATABASE_URL repository secret (Supabase Session pooler URI) to start crawling. See DEPLOY.md."

      - if: env.DATABASE_URL != ''
        uses: actions/checkout@v4

      - if: env.DATABASE_URL != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Cache node_modules itself (not just the npm cache) so most runs skip installing entirely.
      - id: deps
        if: env.DATABASE_URL != ''
        uses: actions/cache@v4
        with:
          path: node_modules
          key: deps-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - if: env.DATABASE_URL != '' && steps.deps.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund

      - name: Crawl, send alerts, prune
        if: env.DATABASE_URL != ''
        run: npx tsx scripts/ingest.ts --direct
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}

      # Even when a crawl fails, keep the 15-minute rhythm going.
      - name: Queue the next crawl
        if: always() && env.DATABASE_URL != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          wait=$(( 900 - ($(date +%s) - STARTED) ))
          if [ "$wait" -gt 0 ]; then sleep "$wait"; fi
          gh workflow run crawl.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
